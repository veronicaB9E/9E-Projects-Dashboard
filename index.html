<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>9E Projects Dashboard</title>
<style>
:root{--brand:#D92129;--brand-d:#B81A21;--bg:#f4f6f9;--surface:#fff;--fg:#121a26;--fg-2:#4a5566;--line:#c4ccd8;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#171e28;--fg:#eef1f5;--fg-2:#b6bfcc;--line:#3a4555;--brand:#E5484D}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{background:#D92129;color:#fff;padding:14px 16px;border-bottom:3px solid #A8161D;font-weight:600;font-size:18px}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 16px rgba(18,26,38,.08)}
h1{font-size:18px;margin:0}
p{margin:0;color:var(--fg-2);font-size:13.5px}
label{font-size:13px;font-weight:600}
input{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px 12px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
button:hover{background:var(--brand-d)}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--crit);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<header>9E Projects Dashboard</header>
<main>
<form id="f" autocomplete="off">
  <h1>Enter the password</h1>
  <p>This dashboard is encrypted. Ask the dashboard owner for the password.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Open dashboard</button>
</form>
</main>
